<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Inventory — Jeff Hurlow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F4F1EC;
    --ink: #1a1a18;
    --ink-mid: #5a5a52;
    --ink-light: #9a9a8e;
    --rule: #d8d4cc;
    --green: #7aad7a;
    --yellow: #c8a84b;
    --gray: #9aacb2;
    --tag-bg: #eceae4;
  }

  html { background: var(--bg); }

  body {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    padding: 0 0 120px;
  }

  /* ── Header ── */
  header {
    padding: 52px 60px 36px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .site-name {
    font-size: 15px;
    letter-spacing: 0.01em;
    color: var(--ink-mid);
  }
  .header-title {
    font-size: 15px;
    font-style: italic;
    color: var(--ink-mid);
  }

  /* ── Controls ── */
  .controls {
    padding: 40px 60px 0;
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-wrap {
    flex: 1;
    min-width: 240px;
    position: relative;
  }

  input[type="text"] {
    width: 100%;
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 17px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--ink);
    padding: 6px 0 6px;
    outline: none;
    letter-spacing: 0.01em;
  }
  input[type="text"]::placeholder { color: var(--ink-light); font-style: italic; }
  input[type="text"]:focus { border-bottom-color: var(--ink); }

  .filter-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-btn {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 14px;
    color: var(--ink-mid);
    background: transparent;
    border: 1px solid var(--rule);
    padding: 4px 12px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--ink-mid); color: var(--ink); }
  .filter-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ── Project view ── */
  .project-select-wrap {
    padding: 32px 60px 0;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .project-label {
    font-size: 15px;
    color: var(--ink-mid);
    font-style: italic;
    white-space: nowrap;
  }
  .project-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .project-pill {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 14px;
    color: var(--ink-mid);
    background: transparent;
    border: 1px solid var(--rule);
    padding: 3px 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .project-pill:hover { border-color: var(--ink-mid); color: var(--ink); }
  .project-pill.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* ── Results meta ── */
  .results-meta {
    padding: 28px 60px 0;
    font-size: 14px;
    color: var(--ink-light);
    font-style: italic;
    min-height: 28px;
  }

  /* ── Table ── */
  .table-wrap {
    padding: 20px 60px 0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--ink-light);
    text-align: left;
    padding: 0 16px 10px 0;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
    letter-spacing: 0.03em;
  }
  thead th:last-child { padding-right: 0; }

  tbody tr {
    border-bottom: 1px solid var(--rule);
    transition: background 0.1s;
  }
  tbody tr:hover { background: rgba(0,0,0,0.025); }
  tbody tr.hidden { display: none; }

  tbody td {
    font-size: 15px;
    padding: 11px 16px 11px 0;
    vertical-align: top;
    color: var(--ink);
  }
  tbody td:last-child { padding-right: 0; }

  .td-num {
    color: var(--ink-light);
    font-size: 13px;
    width: 32px;
    padding-top: 13px;
  }

  .td-component { font-size: 16px; min-width: 200px; }
  .td-component .component-name { display: block; }
  .td-component .component-notes {
    display: block;
    font-size: 13px;
    color: var(--ink-light);
    font-style: italic;
    margin-top: 2px;
    line-height: 1.4;
  }

  .td-cat {
    font-size: 13px;
    color: var(--ink-mid);
    white-space: nowrap;
    width: 110px;
  }

  .td-price {
    font-size: 13px;
    color: var(--ink-mid);
    white-space: nowrap;
    width: 70px;
  }

  .td-assignments { width: 260px; }

  .assign-wrap { display: flex; flex-wrap: wrap; gap: 4px; }

  .assign-tag {
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 2px;
    white-space: nowrap;
    line-height: 1.6;
  }
  .assign-tag.in_hand  { background: #dff0df; color: #3a6e3a; }
  .assign-tag.to_order { background: #fdf3d7; color: #8a6a10; }
  .assign-tag.complete { background: #e4eaed; color: #5a6f76; }
  .assign-tag.unassigned { background: var(--tag-bg); color: var(--ink-light); font-style: italic; }

  /* ── Section headers ── */
  tr.section-row td {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--ink-light);
    text-transform: uppercase;
    padding: 28px 0 8px;
    border-bottom: none;
  }
  tr.section-row:hover { background: transparent; }

  /* ── Project view panel ── */
  .project-panel {
    display: none;
    padding: 32px 60px 0;
  }
  .project-panel.visible { display: block; }

  .project-panel-title {
    font-size: 22px;
    font-style: italic;
    margin-bottom: 4px;
  }
  .project-panel-sub {
    font-size: 14px;
    color: var(--ink-light);
    margin-bottom: 28px;
  }

  .project-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border-top: 1px solid var(--rule);
  }

  .project-item {
    padding: 14px 20px 14px 0;
    border-bottom: 1px solid var(--rule);
  }
  .project-item-name { font-size: 16px; }
  .project-item-meta {
    font-size: 13px;
    color: var(--ink-light);
    margin-top: 2px;
    font-style: italic;
  }
  .project-item-status {
    font-size: 12px;
    margin-top: 5px;
  }
  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }
  .dot-in_hand  { background: var(--green); }
  .dot-to_order { background: var(--yellow); }
  .dot-complete { background: var(--gray); }

  .legend {
    padding: 20px 60px 0;
    display: flex;
    gap: 20px;
    font-size: 13px;
    color: var(--ink-light);
    font-style: italic;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }

  /* ── View toggle ── */
  .view-toggle {
    padding: 32px 60px 0;
    display: flex;
    gap: 28px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0;
  }
  .view-tab {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 15px;
    color: var(--ink-light);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 0 0 12px;
    cursor: pointer;
    font-style: italic;
    transition: all 0.15s;
    margin-bottom: -1px;
  }
  .view-tab:hover { color: var(--ink); }
  .view-tab.active { color: var(--ink); border-bottom-color: var(--ink); }

  /* ── Empty state ── */
  .empty-state {
    padding: 48px 60px;
    font-size: 15px;
    color: var(--ink-light);
    font-style: italic;
  }

  @media (max-width: 768px) {
    header, .controls, .project-select-wrap, .table-wrap,
    .results-meta, .view-toggle, .legend, .project-panel { padding-left: 24px; padding-right: 24px; }
    .project-grid { grid-template-columns: 1fr; }
    .td-cat, .td-price { display: none; }
  }
</style>
</head>
<body>

<header>
  <span class="site-name">Jeff Hurlow</span>
  <span class="header-title">Studio Inventory</span>
</header>

<div class="view-toggle">
  <button class="view-tab active" onclick="setView('inventory')">All parts</button>
  <button class="view-tab" onclick="setView('project')">By project</button>
</div>

<!-- ── INVENTORY VIEW ── -->
<div id="inventory-view">
  <div class="controls">
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search components, categories, notes…" oninput="filterTable()">
    </div>
    <div class="filter-group" id="cat-filters"></div>
  </div>

  <div class="legend">
    <span class="legend-item"><span class="status-dot dot-in_hand"></span>In hand</span>
    <span class="legend-item"><span class="status-dot dot-to_order"></span>To order</span>
    <span class="legend-item"><span class="status-dot dot-complete"></span>Build complete</span>
  </div>

  <div class="results-meta" id="results-meta"></div>

  <div class="table-wrap">
    <table id="parts-table">
      <thead>
        <tr>
          <th class="td-num">#</th>
          <th>Component</th>
          <th>Category</th>
          <th>Price</th>
          <th>Assigned to</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none;">Nothing matches that search.</div>
  </div>
</div>

<!-- ── PROJECT VIEW ── -->
<div id="project-view" style="display:none;">
  <div class="project-select-wrap">
    <span class="project-label">Select a piece —</span>
    <div class="project-pills" id="project-pills"></div>
  </div>

  <div class="project-panel" id="project-panel">
    <div class="project-panel-title" id="panel-title"></div>
    <div class="project-panel-sub" id="panel-sub"></div>
    <div class="project-grid" id="panel-grid"></div>
  </div>
</div>

ic Sensor", "category": "Sensors", "source": "Amazon", "price": "", "assignments": {}, "notes": "From sensor kit."}, {"type": "item", "num": 84, "component": "SR501 Infrared (PIR) Sensor", "category": "Sensors", "source": "Amazon", "price": "", "assignments": {}, "notes": "From sensor kit. Additional unit \u2014 existing HC-SR501 stock tracked separately."}, {"type": "item", "num": 85, "component": "Solder Seal Wire Connectors \u2014 50pc (AWG 12-10/16-14/22-18/26-24)", "category": "Electronics", "source": "Amazon", "price": "", "assignments": {}, "notes": "General supply. 4 gauges/colors. Parts on Hand."}], "install_names": {"PHO": "Call Dad", "PHI": "Philco", "DRV": "Passion Pit", "QRK": "Quarks", "MDV": "Morning Doves", "TYP": "It\u2019s Hard to Say", "DRK": "Hello Darkness", "CLO": "Cloche", "MKY": "Mickey", "R40": "Radio 40s", "DCT": "Dictaphone", "THR": "Thermostat", "RRL": "Reel-to-Reel", "CSH": "Cash Register", "S8": "Super 8", "VNT": "Ventilator", "CLK": "Clock", "ANS": "Answering Machine", "PHO2": "Phone 2"}};

const ITEMS = DATA.items;
const INSTALL_NAMES = DATA.install_names;

let activeCategory = 'All';
let activeProject = null;
let currentView = 'inventory';

// ── Build category filters ──────────────────────────────────────
const categories = ['All', ...new Set(ITEMS.filter(i=>i.type==='item').map(i=>i.category).filter(Boolean))].sort((a,b)=> a==='All'?-1:b==='All'?1:a.localeCompare(b));

const catFilters = document.getElementById('cat-filters');
categories.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (cat === 'All' ? ' active' : '');
  btn.textContent = cat;
  btn.onclick = () => {
    activeCategory = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.textContent === cat));
    filterTable();
  };
  catFilters.appendChild(btn);
});

// ── Build project pills ─────────────────────────────────────────
const projects = [...new Set(ITEMS.filter(i=>i.type==='item').flatMap(i=>Object.keys(i.assignments)))].sort();
const pillsEl = document.getElementById('project-pills');
projects.forEach(code => {
  const btn = document.createElement('button');
  btn.className = 'project-pill';
  btn.textContent = INSTALL_NAMES[code] ? `${INSTALL_NAMES[code]} (${code})` : code;
  btn.onclick = () => {
    activeProject = code;
    document.querySelectorAll('.project-pill').forEach(b => b.classList.toggle('active', b === btn));
    showProjectPanel(code);
  };
  pillsEl.appendChild(btn);
});

// ── Build table ─────────────────────────────────────────────────
const tbody = document.getElementById('table-body');
ITEMS.forEach((item, idx) => {
  const tr = document.createElement('tr');
  if (item.type === 'section') {
    tr.className = 'section-row';
    tr.dataset.section = item.label;
    tr.innerHTML = `<td colspan="5">${item.label}</td>`;
  } else {
    tr.dataset.component = item.component.toLowerCase();
    tr.dataset.category = item.category;
    tr.dataset.notes = item.notes.toLowerCase();
    tr.dataset.source = item.source.toLowerCase();
    tr.dataset.idx = idx;

    const assignKeys = Object.keys(item.assignments);
    let assignHTML = '';
    if (assignKeys.length === 0) {
      assignHTML = '<span class="assign-tag unassigned">unassigned</span>';
    } else {
      assignKeys.forEach(code => {
        const status = item.assignments[code];
        const label = INSTALL_NAMES[code] || code;
        assignHTML += `<span class="assign-tag ${status}" title="${label}">${code}</span>`;
      });
    }

    const priceStr = item.price ? `$${parseFloat(item.price).toFixed(2)}` : '—';

    tr.innerHTML = `
      <td class="td-num">${item.num}</td>
      <td class="td-component">
        <span class="component-name">${item.component}</span>
        ${item.notes ? `<span class="component-notes">${item.notes}</span>` : ''}
      </td>
      <td class="td-cat">${item.category}</td>
      <td class="td-price">${priceStr}</td>
      <td class="td-assignments"><div class="assign-wrap">${assignHTML}</div></td>
    `;
  }
  tbody.appendChild(tr);
});

// ── Filter ──────────────────────────────────────────────────────
function filterTable() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const rows = tbody.querySelectorAll('tr');
  let visibleCount = 0;
  let lastSectionVisible = false;
  let lastSectionRow = null;

  rows.forEach(tr => {
    if (tr.classList.contains('section-row')) {
      // Handle after scanning items in this section
      if (lastSectionRow) lastSectionRow.classList.toggle('hidden', !lastSectionVisible);
      lastSectionRow = tr;
      lastSectionVisible = false;
      return;
    }

    const matchQ = !q || tr.dataset.component.includes(q) || tr.dataset.notes.includes(q) || tr.dataset.source.includes(q) || (tr.dataset.category||'').toLowerCase().includes(q);
    const matchCat = activeCategory === 'All' || tr.dataset.category === activeCategory;
    const visible = matchQ && matchCat;

    tr.classList.toggle('hidden', !visible);
    if (visible) { visibleCount++; lastSectionVisible = true; }
  });

  // Handle last section
  if (lastSectionRow) lastSectionRow.classList.toggle('hidden', !lastSectionVisible);

  const meta = document.getElementById('results-meta');
  const total = ITEMS.filter(i=>i.type==='item').length;
  if (q || activeCategory !== 'All') {
    meta.textContent = `${visibleCount} of ${total} parts`;
  } else {
    meta.textContent = `${total} parts`;
  }

  document.getElementById('empty-state').style.display = visibleCount === 0 ? 'block' : 'none';
}

// ── Project panel ───────────────────────────────────────────────
function showProjectPanel(code) {
  const panel = document.getElementById('project-panel');
  const name = INSTALL_NAMES[code] || code;

  document.getElementById('panel-title').textContent = name;

  const assigned = ITEMS.filter(i => i.type === 'item' && i.assignments[code]);
  const inHand = assigned.filter(i => i.assignments[code] === 'in_hand' || i.assignments[code] === 'complete');
  const toOrder = assigned.filter(i => i.assignments[code] === 'to_order');

  document.getElementById('panel-sub').textContent =
    `${assigned.length} parts — ${inHand.length} in hand, ${toOrder.length} to order`;

  const grid = document.getElementById('panel-grid');
  grid.innerHTML = '';

  assigned.forEach(item => {
    const status = item.assignments[code];
    const statusLabel = status === 'in_hand' ? 'In hand' : status === 'to_order' ? 'To order' : 'Build complete';
    const div = document.createElement('div');
    div.className = 'project-item';
    div.innerHTML = `
      <div class="project-item-name">${item.component}</div>
      <div class="project-item-meta">${item.category}${item.price ? ' · $' + parseFloat(item.price).toFixed(2) : ''}</div>
      <div class="project-item-status">
        <span class="status-dot dot-${status}"></span>${statusLabel}
      </div>
    `;
    grid.appendChild(div);
  });

  panel.classList.add('visible');
}

// ── View toggle ─────────────────────────────────────────────────
function setView(view) {
  currentView = view;
  document.getElementById('inventory-view').style.display = view === 'inventory' ? 'block' : 'none';
  document.getElementById('project-view').style.display = view === 'project' ? 'block' : 'none';
  document.querySelectorAll('.view-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&view==='inventory')||(i===1&&view==='project')));
}

// ── Init ────────────────────────────────────────────────────────
filterTable();
</script>
